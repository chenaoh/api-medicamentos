trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Nombre de la Service Connection con Azure
  azureServiceConnection: 'azure-connection'
  # Nombre de tu Azure Container Registry
  containerRegistry: 'acrapimedicamentos.azurecr.io'
  # Nombre del repositorio dentro de ACR
  imageRepository: 'api-medicamentos'
  # Nombre de tu Azure App Service
  webAppName: 'api-medicamentos-prod'
  # Etiqueta de la imagen Docker
  tag: '$(Build.BuildId)'

stages:
  - stage: BuildAndPush
    displayName: 'Compilar e Impulsar Imagen Docker a ACR'
    jobs:
      - job: Build
        displayName: 'Build and Push Job'
        steps:
          # Tarea para construir y subir la imagen Docker a ACR
          - task: Docker@2
            displayName: 'Construir y subir la imagen a ACR'
            inputs:
              command: buildAndPush
              repository: $(imageRepository)
              dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
              containerRegistry: $(azureServiceConnection)
              tags: |
                $(tag)
                latest
  - stage: Deploy
    displayName: 'Desplegar a Azure App Service'
    dependsOn: BuildAndPush
    jobs:
      - job: Deploy
        displayName: 'Deploy Job'
        steps:
          # Tarea para desplegar el contenedor en App Service
          - task: AzureWebAppContainer@1
            displayName: 'Desplegar contenedor en Azure App Service'
            inputs:
              azureSubscription: $(azureServiceConnection)
              appName: $(webAppName)
              containers: '$(containerRegistry)/$(imageRepository):$(tag)'
